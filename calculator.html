<!DOCTYPE html>
<html lang="zh-CN">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <title>计算器</title>
    <style>
        :root {
            /* 浅色系配色方案 */
            --bg-page: #f5f5f7;       /* 浅灰背景 */
            --bg-header: rgba(255, 255, 255, 0.8);
            --bg-calc: #ffffff;       /* 纯白卡片 */
            --bg-btn: #f2f2f7;        /* 按钮浅灰 */
            --bg-btn-hover: #e5e5ea;
            --accent: #007AFF;        /* 蓝色点缀 */
            --text-main: #1d1d1f;     /* 深色文字 */
            --text-sec: #86868b;      /* 次要文字 */
            --danger: #ff3b30;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-page);
            font-family: -apple-system, "SF Pro Display", "PingFang SC", sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* --- 顶部导航栏 --- */
        header {
            width: 100%;
            height: 60px;
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center; /* 居中 */
            align-items: center;
            position: fixed;
            top: 0;
            z-index: 100;
        }

        nav {
            width: 95vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 简约 Logo 设计 */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
        }

        .logo-icon {
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 5px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 3px;
            gap: 2px;
        }
        .logo-icon div { background: white; border-radius: 1px; }

        .nav-links {
            display: flex;
            gap: 12px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-sec);
            font-size: 0.95rem;
            padding: 6px 12px;
            border-radius: 10px;
            transition: color 0.2s, background 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
            background: rgba(0, 122, 255, 0.1);
        }

        /* --- 计算器主体 --- */
        .main-container {
            margin-top: 120px; /* 为 Header 留出空间 */
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .calculator {
            background: var(--bg-calc);
            width: 400px;
            padding: 35px;
            border-radius: 32px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.02);
        }

        #display-container {
            margin-bottom: 30px;
        }

        #display {
            width: 100%;
            height: 80px;
            font-size: 3.5rem;
            background: transparent;
            border: none;
            color: var(--text-main);
            text-align: right;
            outline: none;
            padding: 0;
            font-weight: 300;
            caret-color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        button {
            height: 72px;
            border-radius: 20px;
            border: none;
            font-size: 1.5rem;
            color: var(--text-main);
            background: var(--bg-btn);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        button:hover {
            background: var(--bg-btn-hover);
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.96);
        }

        /* 颜色区分 */
        .btn-clear { color: var(--danger); background: #fff1f0; }
        .btn-clear:hover { background: #ffe4e3; }
        .btn-op { color: var(--accent); font-weight: 500; }
        .btn-eq { background: var(--accent); color: white; box-shadow: 0 10px 20px rgba(0,122,255,0.2); }
        .btn-eq:hover { background: #006ee5; }
        
        svg { width: 28px; height: 28px; fill: currentColor; }

        @media (max-width: 620px) {
            nav {
                width: 94vw;
                gap: 16px;
            }

            .logo span {
                display: none;
            }

            .nav-links {
                gap: 8px;
            }

            .nav-links a {
                font-size: 0.9rem;
                padding: 6px 9px;
            }

            .main-container {
                margin-top: 110px;
            }

            .calculator {
                width: min(400px, 92vw);
                padding: 28px;
            }
        }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="./calculator.html" class="logo">
            <div class="logo-icon">
                <div></div><div></div><div></div><div></div>
            </div>
            <span>极简工具库</span>
        </a>
        <ul class="nav-links">
            <li><a href="./todo.html">待办事项</a></li>
            <li><a href="./calculator.html" class="active">计算器</a></li>
            <li><a href="./schedule.html">个人课表</a></li>
        </ul>
    </nav>
</header>

<div class="main-container">
    <div class="calculator">
        <div id="display-container">
            <input type="text" id="display" value="0" spellcheck="false" autocomplete="off">
        </div>
        
        <div class="grid">
            <button class="btn-clear" onclick="clearAll()">AC</button>
            <button class="btn-op" onclick="backspace()">
                <svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
            </button>
            <button class="btn-op" onclick="handleBracket()">()</button>
            <button class="btn-op" onclick="insert('/')">÷</button>
            
            <button onclick="insert('7')">7</button>
            <button onclick="insert('8')">8</button>
            <button onclick="insert('9')">9</button>
            <button class="btn-op" onclick="insert('*')">×</button>
            
            <button onclick="insert('4')">4</button>
            <button onclick="insert('5')">5</button>
            <button onclick="insert('6')">6</button>
            <button class="btn-op" onclick="insert('-')">-</button>
            
            <button onclick="insert('1')">1</button>
            <button onclick="insert('2')">2</button>
            <button onclick="insert('3')">3</button>
            <button class="btn-op" onclick="insert('+')">+</button>
            
            <button onclick="insert('%')">%</button>
            <button onclick="insert('0')">0</button>
            <button onclick="insert('.')">.</button>
            <button class="btn-eq" onclick="calculate()">=</button>
        </div>
    </div>
</div>

<script>
    const el = document.getElementById('display');

    function setCursor(pos) {
        el.focus();
        el.setSelectionRange(pos, pos);
    }

    function insert(val) {
        const start = el.selectionStart;
        const end = el.selectionEnd;
        const text = el.value;
        if (text === '0' && val !== '.') {
            el.value = val;
            setCursor(1);
        } else {
            el.value = text.slice(0, start) + val + text.slice(end);
            setCursor(start + 1);
        }
    }

    function clearAll() {
        el.value = '0';
        setCursor(1);
    }

    function backspace() {
        const start = el.selectionStart;
        const end = el.selectionEnd;
        if (start === end && start > 0) {
            el.value = el.value.slice(0, start - 1) + el.value.slice(start);
            setCursor(start - 1);
        } else {
            el.value = el.value.slice(0, start) + el.value.slice(end);
            setCursor(start);
        }
        if (el.value === '') { el.value = '0'; setCursor(1); }
    }

    function handleBracket() {
        const text = el.value;
        const leftCount = (text.match(/\(/g) || []).length;
        const rightCount = (text.match(/\)/g) || []).length;
        const lastChar = text.slice(el.selectionStart - 1, el.selectionStart);
        if (leftCount > rightCount && !['+', '-', '*', '/', '('].includes(lastChar) && text !== '0') {
            insert(')');
        } else {
            insert('(');
        }
    }

    function calculate() {
        try {
            let expression = el.value.replace(/×/g, '*').replace(/÷/g, '/').replace(/(\d+)%/g, '($1/100)');
            let result = eval(expression);
            const finalResult = String(Number(result.toPrecision(12)));
            el.value = finalResult;
            setTimeout(() => setCursor(finalResult.length), 0);
        } catch {
            el.value = "Error";
            setTimeout(clearAll, 1200);
        }
    }

    el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); calculate(); }
        if (e.key === 'Escape') clearAll();
    });

    window.onload = () => setCursor(el.value.length);
</script>

</body>
</html>
